# Self-update ("continuous training").
# Every Monday this checks the BAG catalogue for new premium or insured-population data.
# The BAG publishes once a year (end of September), so most runs end with "no new data".
# When something new appears, `marktradar update`
#   1. measures the current production model on the years it has never seen (live check),
#   2. retrains and runs the quality gate,
#   3. records the new data version in config/data_manifest.json,
# and this workflow opens a pull request with a report. You decide by merging.
#
# Raw archives and the model registry are kept between runs in the Actions cache, so
# the archives are downloaded only once and the live check has a previous model to test.
# One-time setup: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".
name: data-update

on:
  schedule:
    - cron: "23 6 * * 1"  # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Restore raw data and model registry
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            models
          key: marktradar-state-${{ github.run_id }}
          restore-keys: marktradar-state-

      - name: Look for new BAG data, retrain if needed
        id: update
        run: |
          set +e
          uv run marktradar update --report report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save raw data and model registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            models
          key: marktradar-state-${{ github.run_id }}

      - name: Pull request with the new data version
        if: steps.update.outputs.exit == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/data-update
          add-paths: config/data_manifest.json
          commit-message: "Update to the latest BAG premium data"
          title: "New BAG data: model retrained"
          body-path: report.md
          delete-branch: true

      - name: Candidate rejected -> fail the run so you get notified
        if: steps.update.outputs.exit == '2'
        run: |
          echo "::error::The new model did not pass the quality gate, see the run summary."
          exit 1
