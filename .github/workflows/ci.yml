# CI/CD for marktradar
#  - every push/PR: lint, types, tests (synthetic data, no network needed)
#  - monthly + manual: real training on BAG data, model + metrics as an artifact,
#    then build the Docker image and smoke-test it
name: marktradar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 3 * *"  # 3. Tag jedes Monats, 05:17 UTC
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml

  train:
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run marktradar download
      - run: uv run marktradar build
      - run: uv run marktradar train
      - name: Metrics in the job summary
        run: |
          echo '### Backtest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat models/*/metadata.json | uv run python -c "import json,sys; m=json.load(sys.stdin); print(json.dumps({h: v['backtest'] for h, v in m['horizonte'].items()}, indent=2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: modell
          path: |
            models/
            data/processed/

  docker:
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marktradar .
      - name: Smoke-test the container
        run: |
          docker run -d --name mr -p 8000:8000 marktradar
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/prognose -H 'Content-Type: application/json' \
               -d '{"bag_nr": 8, "praemienanpassung_rel_pp": 1}'
          docker rm -f mr
